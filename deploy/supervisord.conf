[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/home/user/sell_analysis/data/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
silent=false
identifier=sell-analysis

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:scraper]
command=/usr/local/bin/python3 /home/user/sell_analysis/main.py scrape
directory=/home/user/sell_analysis
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/home/user/sell_analysis/data/scraper.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/user/sell_analysis/data/scraper.err.log
stderr_logfile_maxbytes=5MB
environment=PYTHONUNBUFFERED="1"

[program:dashboard]
command=/usr/local/bin/streamlit run /home/user/sell_analysis/dashboard/app.py
directory=/home/user/sell_analysis
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/home/user/sell_analysis/data/dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/user/sell_analysis/data/dashboard.err.log
stderr_logfile_maxbytes=5MB
environment=PYTHONUNBUFFERED="1"
