# ═══════════════════════════════════════════════════════════════════════════
# Searches read straight from the portal with a headless browser
# ═══════════════════════════════════════════════════════════════════════════
# Habitaclia's alert emails are summaries: "1.772 novedades en comarca
# Barcelonès" arrives carrying four flats. Its search pages list every one,
# thirty-odd to a page, with floor, bathrooms and price cuts the emails
# never had. Each search names its own city and barrio, because the card's
# location line cannot be trusted to: "Manresa, Barcelona" is town then
# province, and read like "Sant Andreu, Barcelona Capital" it filed every
# Manresa flat under Barcelona.
#
# maxPrice is applied by Habitaclia itself; sorting by date is not
# available, so new listings are found by comparing with what was already
# seen, not by trusting the order of the page.
# Idealista through an Apify actor (memo23/idealista-scraper). Its emails
# cannot be a feed: a morning burst and a daily summary capped at twenty,
# with no "immediate" option — on 27 October a Molins de Rei ático at
# 255.000 € was on the app at 22:09 and in no email. Needs the APIFY_TOKEN
# secret; without it this source is off.
#
# Cost, on Apify's free plan ($5 a month of credit): $0.007 a run plus
# $0.001 per flat delivered, and monitoring mode delivers only the flats no
# earlier run saw. Every 90 minutes by day, ~10 runs: about $3 a month.
#
# The filters are a first cut, wide enough for the near misses (65 m²,
# 330.000 €); the profile decides. "free" excludes flats Idealista itself
# lists as tenanted, bare ownership or occupied; no ground floors.
apify:
  idealista:
    enabled: true
    interval_minutes: 90
    max_items: 60          # per run, a ceiling on cost should anything go wrong
    timeout_seconds: 600
    input:
      country: es
      operation: sale
      propertyType: homes
      language: es
      locations:
        - Molins de Rei
        - Sant Feliu de Llobregat
        - Esplugues de Llobregat
        - Sant Just Desvern
        - Cornellà de Llobregat
        - Badalona
        - Santa Coloma de Gramenet
        - Horta-Guinardó, Barcelona
        - Sant Andreu, Barcelona
        - Nou Barris, Barcelona
        - Sant Martí, Barcelona
        - Sants-Montjuïc, Barcelona
        - L'Hospitalet de Llobregat
      minSize: 60
      maxPrice: 330000
      currentOccupationType: [free]
      floorHeights: [topFloor, intermediateFloor]
      publicationDate: "Y"   # the last 48 hours, the shortest Idealista offers for sale
      fetchDetails: true     # the seller's whole description, to screen for occupation
      compact: true
      splitByPrice: false

  # Fotocasa the same way (memo23/fotocasa-scraper): its alert emails are a
  # sample, like Idealista's, and its pages refuse the runner. Monitor mode
  # delivers only flats no earlier run saw; Fotocasa's own flags for
  # occupied, tenanted, bare ownership and auction come with each row. One
  # search per town or district, newest first, 65 m² and 330.000 € (wide
  # enough for near misses). About $0.001 a flat delivered.
  fotocasa:
    enabled: true
    interval_minutes: 90
    # One run per search, each reading its 10 newest flats: a single run's
    # cap would be spent on the first search and never reach the rest.
    per_search: 10
    timeout_seconds: 600
    input:
      flatten: false
      startUrls:
        - "https://www.fotocasa.es/es/comprar/viviendas/molins-de-rei/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/sant-feliu-de-llobregat/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/esplugues-de-llobregat/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/sant-just-desvern/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/cornella-de-llobregat/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/badalona/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/santa-coloma-de-gramenet/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/l-hospitalet-de-llobregat/todas-las-zonas/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/horta-guinardo/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/sant-andreu/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/nou-barris/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/sant-marti/l?maxPrice=330000&minSurface=60&sortType=publicationDate"
        - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/sants-montjuic/l?maxPrice=330000&minSurface=60&sortType=publicationDate"

browser_scraping:
  habitaclia:
    enabled: true
    max_pages: 3
    # Read newest first, a search usually needs one page: once a page holds
    # only flats already known the rest is skipped. That makes a pass two or
    # three minutes, so it can come round every ten — "que todo entre
    # rápido", and Habitaclia above all. The loop ticks every three.
    interval_minutes: 10
    # Each search asks Habitaclia itself for ≤320.000 € (the stretch ceiling —
    # the 285.000 € budget and the exception are applied by the profile) and
    # ≥70 m², which cuts the pages to read by more than half.
