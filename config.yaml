database:
  path: data/real_estate.db

# ═══════════════════════════════════════════════════════════════════════════
# ACQUISITION: portal alert emails (primary) — see docs/EMAIL_SETUP.md
#
# Scraping is dead for the portals that matter: Idealista and Fotocasa return
# 403 even from a residential IP, Habitaclia serves an anti-bot interstitial,
# and the bank portals are now SPAs with no server-rendered listings.
# Alert emails carry the same data, arrive pushed, and cannot be blocked.
# ═══════════════════════════════════════════════════════════════════════════
email_ingest:
  enabled: true
  backend: gmail_api          # gmail_api (OAuth, read-only) | imap (app password)
  token_path: data/gmail_token.json

  # Must include Spam: Gmail files portal alerts there routinely — every
  # Idealista alert was sitting in Spam while the inbox looked empty, which
  # reads exactly like "no new listings". Trash is excluded on purpose.
  query: "in:anywhere -in:trash"

  # Fetch only mail from the portals we parse, instead of everything new.
  #
  # For a mailbox that exists only to receive alerts this changes nothing.
  # It matters when the mailbox also carries real correspondence: without
  # it the bot downloads every new message before deciding, and those
  # messages pass through a CI runner whose read token lives in a public
  # repository's secrets. Built from the portal registry, so adding a portal
  # cannot leave the filter behind.
  only_portal_senders: true

# ── Reading the listing page ───────────────────────────────────────────────
# Alert emails omit the condition for most listings, and "para reformar" is
# worth tens of thousands in works the bank will not finance. For the few
# that match a profile, the page itself is read to recover it.
#
# Same treatment for every portal; it simply succeeds where the portal
# allows. Idealista and Fotocasa refuse datacenter IPs, so those keep their
# "condition unknown" flag rather than gaining a false one.
enrichment:
  enabled: true

scraping:
  enabled: false              # portals block us; kept for when that changes
  delay_min_seconds: 8
  delay_max_seconds: 15
  respect_robots: false
  proxy: ""                   # SCRAPER_PROXY env var overrides this
  proxy_list: []
  max_retries: 3
  selenium_fallback: false

# ═══════════════════════════════════════════════════════════════════════════
# SEARCH MODE: buy-to-let investment
# ═══════════════════════════════════════════════════════════════════════════
search_mode: investment

# ── Financing profile ──────────────────────────────────────────────────────
# Drives cuota, cashflow, cash-on-cash and DSCR. Adjust to whatever your
# bank actually offers you.
financing:
  ltv_pct: 90                 # banks are lending 90% again; 10% down payment
  annual_rate_pct: 3.0        # mortgage rate
  years: 30

  # What the buyer actually holds. The purchase demands 10% deposit plus
  # ~12% costs; anything above this is borrowed, and that loan has its own
  # monthly payment. Leaving it out makes every deal look affordable and
  # every cashflow look better than it is.
  # Two different numbers. available_cash is what the buyer can actually
  # deploy; comfortable_cash is what he would rather not exceed. Anything
  # between them is reserve — spendable, but worth being told about, since
  # "this one eats into your buffer" is a different decision from "this one
  # fits".
  available_cash: 40000
  comfortable_cash: 30000
  gap_loan_rate_pct: 5.5      # personal loan for anything above 40.000 €
  gap_loan_years: 8

  # Mortgage broker, paid only if one is needed. Usual shape in Spain is a
  # percentage with a floor.
  broker_fee_pct: 0.0
  broker_fee_min: 0

# ═══════════════════════════════════════════════════════════════════════════
# SEARCH PROFILES
#
# Three searches running at once over the same mailbox. They are separate
# because their criteria contradict each other: the home to live in is about
# a specific set of streets and needing no work, the investment is about a
# number and could be anywhere in Catalonia.
#
# A listing alerts if it matches ANY enabled profile, and the alert says
# which one. Place names are matched ignoring accents and apostrophes.
# ═══════════════════════════════════════════════════════════════════════════
search_profiles:

  # ── 1. Home to live in ──────────────────────────────────────────────────
  - name: vivienda
    label: "🏠 Para vivir"
    enabled: true
    # A home, not an investment: there is no rent and no cashflow to judge.
    # Zone, price, size, light, lift and condition decide. Set by the buyer
    # on 24 October 2026, replacing the earlier search.
    purpose: home

    # 300.000 € is the budget (285.000 € until 30 October, raised with 65 m²
    # and the neighbouring barris when too few flats came through). Up to
    # 320.000 € only an exceptional flat goes out — "si fuera a más es porque
    # estamos viendo un piso muy bueno que amerita pagarlo" — meaning outdoor
    # space plus real size, real light or no work to do. The card says how
    # far over it is and why it passed.
    max_price: 300000
    stretch_max_price: 320000
    stretch_min_area_m2: 85

    # A good flat at a good price, close to the target, also goes out marked
    # "Casi" — "si ves una oportunidad interesante, aunque se pase un poco
    # de los límites, me la puedes enviar"; "buen piso a buen precio, cerca
    # de precio objetivo, sin reforma". Exactly one of these may be missed,
    # and only by this much: size, price or rooms. Floor, lift, light and occupation are never eased, and the
    # flat must need no work at all — once its advert is read, it must say
    # it is ready to live in. It must ask at least min_discount_pct less
    # per m² than its zone's median, and not so much less (max_discount_pct)
    # that it is a warning rather than a deal.
    near_miss:
      area_m2: 5          # down to 60 m²
      price_pct: 10       # up to 330.000 €
      rooms: 1            # one bedroom fewer
      min_discount_pct: 8
      max_discount_pct: 35

    min_area_m2: 65
    min_rooms: 2

    # A lift, or a walk-up no higher than the second floor. Only a stated
    # "sin ascensor" counts against a flat; silence is not read as absence.
    lift_or_max_floor: 2
    # No ground floors: they are the opposite of the light he asked for.
    min_floor: 1

    # Light: a flat its own advert calls interior is refused.
    reject_interior: true
    prefer_bright: true

    # Renovated, ready to move in, or needing a little work — not a gutting.
    # "Con reforma integral" usually means the job is done, so only adverts
    # that *need* one are refused.
    reject_heavy_reform: true

    # Districts are scoped to their town: "Congrés" is a barrio in Badalona
    # as well as in Barcelona, and only one of them is wanted. An entry with
    # no districts accepts the whole town. Matching ignores accents,
    # apostrophes and articles, so "el guinardo" also covers "Baix Guinardó".
    areas:
      # ── Zona 1 · Baix Llobregat, whole towns ──────────────────────────
      - city: molins de rei
      - city: sant feliu de llobregat
      - city: esplugues
      - city: sant just desvern
      - city: cornella
      # ── Zona 2 · Badalona ─────────────────────────────────────────────
      - city: badalona
        districts: [centre, bufala, bonavista, morera, montigala, sant crist,
                    casagemes, canyado, dalt de la vila, manresa, gorg]
      # ── Zona 3 · Santa Coloma: the centre, its best-priced barrio, on L1
      - city: santa coloma de gramenet
        districts: [centre]
      # ── Zona 4 · Barcelona, and Zona 6 · La Marina del Port (L10) ─────
      - city: barcelona
        districts:
          - el guinardo
          - baix guinardo       # the Maragall end of Guinardó
          - maragall
          - navas
          - sant andreu         # Sant Andreu de Palomar
          - la sagrera
          - congres             # El Congrés i els Indians
          - turo de la peira
          - can peguera         # Habitaclia files it under Turó de la Peira
          - vilapicina
          - torre llobeta
          - el clot
          - camp de l arpa
          - marina del port
          # Their neighbours, added on 30 October
          - horta
          - font d en fargues
          - can baro
          - porta
          - sagrada familia
          - sant marti de provencals
          - provencals del poblenou
      # ── Zona 5 · L'Hospitalet: its highest-income barrios, on L1 ──────
      - city: hospitalet
        districts: [centre, sant josep, sanfeliu, santa eulalia]

  # ── 2. Investment ───────────────────────────────────────────────────────
  - name: inversion
    label: "💰 Inversión"
    enabled: false   # 24-oct-2026: the buyer is looking to live, not to invest
    purpose: investment

    # No zone restriction: anywhere in Catalonia within driving distance.
    # Distance is not enforced — the portal alerts already bound the area, and
    # nothing in the listing data gives a reliable travel time.

    # An investment has to stand on its own: reachable with the cash in hand,
    # and paying its own way from month one. Both bars must clear.
    min_net_yield_pct: 6.0
    min_monthly_cashflow: 0

    # Entry must fit the 40.000 € the buyer can reach, without borrowing:
    # a flat that needs a loan just to be entered is not funding itself.
    # At ~22% of price in deposit and costs that is a ~180.000 € ceiling.
    # Between 30.000 € and 40.000 € the alert says it is using the reserve.
    max_cash_needed: 40000
    max_cash_gap: 0

    # Town size, as a proxy for everyday services: supermarket, health
    # centre, school, train. Mercadona opens above roughly this size. A
    # village of 2.000 may be cheap, but the exit is the problem — a flat
    # there takes far longer to let and to sell again.
    min_population: 20000
    reject_unknown_population: true

    # Do not send what could not be checked. The cheapest flats are cheap
    # because they are occupied or unmortgageable, and the alert email never
    # says so — the page does. If the page could not be read, the listing
    # stays unsent rather than arriving with an unverifiable 9% yield.
    # Off by request. It held back everything: Idealista, Fotocasa and
    # Habitaclia all refuse to be read, so 82% of listings could not have
    # their condition checked and the profile matched nothing at all.
    # Anything unverifiable now arrives stamped SOSPECHOSO with the tells
    # spelled out — cheaper than the zone, few photos, unread advert — and
    # the judgement moves to the person who can open the page.
    require_verified_condition: false

    # Zones ruled out by hand. There is no free, structured dataset for
    # "how conflictive is this neighbourhood", so this list stands in for
    # one, using the criterion there IS published data for: the lowest
    # household-income neighbourhoods of their metropolitan area (INE Atlas
    # de distribución de renta). That is the same signal that drives the
    # risk an investor actually carries here — longer voids, harder resale,
    # tenants who cannot absorb a rent rise.
    #
    # These are a starting point, not a verdict. Edit freely: anything named
    # here is dropped before the yield is even computed.
    excluded_zones:
      - sant roc            # Badalona
      - la salut            # Badalona
      - can puiggener       # Sabadell
      - la mina             # Sant Adrià de Besòs
      - ciutat meridiana    # Barcelona
      - torre baro          # Barcelona
      - vallbona            # Barcelona
      - sant cosme          # El Prat de Llobregat

  # ── 3. Home, further out and bigger ─────────────────────────────────────
  # The trade the buyer is willing to make: leave the city, gain square
  # metres. Same purpose as the Barcelona search — no rental maths — but
  # stricter on what the flat has to be, since distance has to buy something.
  - name: vivienda_fuera
    label: "🏠 Para vivir (fuera)"
    enabled: false   # 24-oct-2026: the buyer is looking to live, not to invest
    purpose: home
    max_price: 330000
    min_rooms: 3
    min_area_m2: 80

    # High floor, and light. Moving out of Barcelona for a dark second floor
    # would be paying the commute for nothing.
    min_floor: 2
    require_any_of: [balcon, balcón, terraza, terrat, patio]
    prefer_bright: true

    areas:
      - city: premia de mar
      - city: castelldefels
      - city: gava
      - city: mataro

    condition_in: [nuevo, buen_estado]
    needs_work_below_price: 240000

  # ── 4. New build ────────────────────────────────────────────────────────
  # Disabled: no portal alert feeds it yet, so it would never fire. Enable it
  # once an "obra nueva" alert exists, within 40 min of Barcelona.
  - name: obra_nueva
    label: "🏗 Obra nueva"
    enabled: false
    max_price: 400000
    min_rooms: 2
    condition_in: [nuevo]

# ── Target locations ──────────────────────────────────────────────────────
# TEST MODE: solo Barcelona, barrios específicos alrededor de Maragall/Clot
target_locations:
  - city: barcelona
    preferred_districts:
      - "maragall"
      - "el guinardó"
      - "guinardó"
      - "el camp de l'arpa del clot"
      - "camp de l'arpa"
      - "camp de l arpa"
      - "el clot"
      - "clot"
      - "la sagrada família"
      - "la sagrada familia"
      - "sagrada família"
      - "sagrada familia"
      - "navas"
      - "la sagrera"

# ── Residence criteria: single profile ─────────────────────────────────────
residence_criteria:
  profile_general:
    label: "General"
    max_price: 335000                  # tope hasta 335k
    min_rooms: 3                        # más de 2 hab
    require_condition: null             # any condition allowed
    forbid_condition: ["reformar"]      # no reformar (casi para entrar a vivir)
    max_years_old: null                 # no restringido

# ── Common requirements ────────────────────────────────────────────────────
common_requirements:
  min_area_m2: 60                       # tamaño razonable
  require_elevator: true                # ascensor obligatorio
  require_balcony: false                # no obligatorio
  min_floor: 3                          # planta ≥ 3 (después de la 2ª)
  max_published_ago_hours: 48           # solo anuncios publicados en las últimas 48h

# ═══════════════════════════════════════════════════════════════════════════
# Portals - URLs per target location
# ═══════════════════════════════════════════════════════════════════════════
portals:
  # ── Runs on residential IP (Mac) → all 4 portals available ─────────────
  pisos:
    enabled: true
    search_urls:
      - "https://www.pisos.com/venta/pisos-barcelona-el_guinardo/"
      - "https://www.pisos.com/venta/pisos-barcelona-la_sagrada_familia/"
      - "https://www.pisos.com/venta/pisos-barcelona-el_clot/"
      - "https://www.pisos.com/venta/pisos-barcelona-navas/"
    max_pages: 5

  habitaclia:
    enabled: true
    search_urls:
      - "https://www.habitaclia.com/viviendas-el_camp_del_arpa_del_clot-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-el_clot-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-la_sagrada_familia-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-navas-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-el_guinardo-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-la_sagrera-barcelona.htm"
    max_pages: 5

  idealista:
    enabled: true
    search_urls:
      - "https://www.idealista.com/venta-viviendas/barcelona/eixample/la-sagrada-familia/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-marti/el-camp-de-larpa-del-clot/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-marti/el-clot/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-andreu/navas/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/horta-guinardo/el-guinardo/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-andreu/la-sagrera/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
    max_pages: 5
  fotocasa:
    enabled: true
    search_urls:
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/la-sagrada-familia/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-clot/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-camp-de-l-arpa-del-clot/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/navas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-guinardo/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/la-sagrera/l"
    max_pages: 5

  # ── Bank-owned portals: not relevant for Barcelona metro residence search ──
  servihabitat:
    enabled: false
    search_urls: []
    max_pages: 3
  solvia:
    enabled: false
    search_urls: []
    max_pages: 3

# ═══════════════════════════════════════════════════════════════════════════
# Alerts
# ═══════════════════════════════════════════════════════════════════════════
alerts:
  # Only what is news. A listing first seen longer ago than this is never
  # alerted, by the live path or by the sweep that catches up after quiet
  # hours. A flat advertised weeks ago is most likely gone, and a burst of
  # them after an outage is noise, not information.
  fresh_hours: 24
  verification:
    # Portals whose adverts are read in full before any alert. A flat whose
    # page cannot be read here is held and retried, never sent unchecked.
    # Idealista and the bank sites refuse every read from the runner, so
    # their flats go out on their email's own words, marked "sin verificar".
    must_read_portals: [habitaclia, fotocasa]
  telegram:
    # Off since 24-oct-2026: the user follows the phone notifications only
    # ("no quiero telegram, no le veré más"). Every flat and every failure
    # notice goes to ntfy instead. It only actually switches off when
    # NTFY_TOPIC is set, so a missing secret cannot leave the bot mute.
    enabled: false
    token: "${TELEGRAM_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    # Only used by the legacy scraping path and the daily digest ranking.
    # Alerts from the email pipeline are gated by search_profiles, not by
    # this score: rental return is meaningless for a home to live in.
    min_score_threshold: 60
    cooldown_hours: 24

    # Proof of life, off by request: only send when there is something to
    # send. Silence is ambiguous — a quiet mailbox and a dead bot read the
    # same — so the check moved to being asked rather than announced: write
    # "estado" and the bot reports its last cycle. Set a number of minutes
    # here to bring the announcement back.
    pulse_minutes: 0

    # A mailbox that will not open is not a heartbeat, it is an event: the
    # bot went twenty hours dead once and nothing said so. Reported at most
    # this often, so a failure that persists does not become a message every
    # three minutes.
    failure_notice_minutes: 60

    # A mailbox can also fail without any call failing: the portals just stop
    # arriving. Forty-four hours passed that way — every request returning
    # 200, the bot reporting itself healthy — because Google had disabled the
    # OAuth client and an empty result was indistinguishable from a quiet
    # Saturday. Below, going this long without a single listing is itself
    # reported.
    stale_mailbox_hours: 12

    # Hard ceiling on everything that leaves this bot.
    #
    # Every message passes one chokepoint, and the chokepoint counts. Once a
    # budget is spent the message is dropped and logged, no matter what part
    # of the code asked for it. This is not tuning: it is the guarantee that
    # a bug of mine cannot turn into a phone buzzing every three minutes,
    # which it did twice in one day and cost a day of trust to find.
    #
    # An unlabelled message is refused outright. Any future code path that
    # sends without declaring what it is gets blocked rather than trusted.
    limits:
      total_per_day: 25
      per_kind:
        piso: 20          # a listing that matches and has never been sent
        casi: 5           # a bargain that misses one limit by a little
        control: 1        # the morning report on yesterday's flats
        fallo: 2          # the mailbox will not open
        resumen: 1        # the manual daily summary
        respuesta: 25     # answers to messages he typed himself
        otro: 0           # anything that forgot to say what it is

    # Night. Local hours, because "de noche" means his night and Spain is
    # one or two hours off UTC depending on the season. A listing found in
    # this window is not dropped — nothing is recorded as sent while quiet,
    # so the first waking cycle sends it.
    quiet_hours:
      from: 23
      to: 8

scheduler:
  scrape_interval_hours: 12
  rental_scrape_interval_days: 30    # rental data less important for residence search

# ═══════════════════════════════════════════════════════════════════════════
# Legacy investment analysis (kept but not used when search_mode=residence)
# ═══════════════════════════════════════════════════════════════════════════
analysis:
  # Guards against listings whose m² is the plot rather than the built area
  # (masías, casas con terreno). Rent is estimated per m², so those produce a
  # fake rent and a fake yield that would rank first.
  sanity:
    min_price_per_m2: 800
    max_price_per_m2: 15000

  # Full refurbishment in the Barcelona area, per m² of built area. A rough
  # figure — kitchen, bathroom, floors, wiring — but far closer than zero,
  # which is what a listing marked "para reformar" was being costed at.
  # Only applied when the advert says the flat needs work.
  reform_cost_per_m2: 500

  assumed_expenses_pct: 0.25
  purchase_costs_pct:
    default: 0.12
    madrid: 0.07
    barcelona: 0.12       # ITP 10% + notaría, registro y gestoría
    andalucia: 0.09
    valencia: 0.10
  min_yield_alert_pct: 6.0
  capital_growth_annual_pct: 2.5
  scoring_weights:
    gross_yield: 0.35
    price_per_m2: 0.25
    location_score: 0.20
    condition_score: 0.10
    roi_net: 0.10

rental_scraping:
  portals:
    pisos:
      enabled: false
      max_pages: 3
      urls: []
    idealista:
      enabled: false
      max_pages: 3
      urls: []
    fotocasa:
      enabled: false
      max_pages: 3
      urls: []

# ═══════════════════════════════════════════════════════════════════════════
# Fallback rent per m² (used only if search_mode=investment)
# ═══════════════════════════════════════════════════════════════════════════
fallback_rent_per_m2:
  # Alquiler medio por m² y mes. Se usa cuando no hay datos propios de la
  # zona en rent_zone_averages — que ahora mismo es SIEMPRE, porque esa
  # tabla está vacía y los scrapers de alquiler están desactivados.
  #
  # Antes aquí sólo estaban las capitales, y todo pueblo de la provincia
  # heredaba el 75% de Barcelona: 13,5 €/m² para Terrassa, para Mataró y
  # también para Manresa, que alquila casi la mitad. Peor aún, las
  # ciudades fuera de la provincia caían al 5,5 por defecto — Tarragona,
  # Vic, Vilafranca y Lleida salían a 385 € por un piso de 70 m², así que
  # ninguna alcanzaba jamás el mínimo de rentabilidad y se descartaban sin
  # decir nada. Eso hacía imposible buscar fuera del área metropolitana.
  #
  # Estos valores son ESTIMACIONES de mercado, no datos medidos. Sirven
  # para ordenar y descartar, no para decidir una compra: el número real
  # hay que contrastarlo con tres alquileres de la misma calle.
  madrid: 16.5
  valencia: 11.0
  sevilla: 10.5
  zaragoza: 9.0
  malaga: 12.0
  bilbao: 13.5
  palma: 14.0
  alicante: 11.5
  granada: 9.5

  # ── Barcelona ciudad y primera corona ──────────────────────────────
  barcelona: 18.0
  esplugues de llobregat: 16.0
  sant just desvern: 16.5
  castelldefels: 16.0
  sitges: 16.0
  hospitalet de llobregat: 15.5
  cornellà de llobregat: 15.0
  sant joan despí: 15.0
  badalona: 14.5
  sant adrià de besòs: 14.5
  santa coloma de gramenet: 14.0
