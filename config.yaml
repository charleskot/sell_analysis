database:
  path: data/real_estate.db

scraping:
  delay_min_seconds: 3
  delay_max_seconds: 8
  respect_robots: true
  #
  # ── Residential Proxy ──────────────────────────────────────────────────────
  # Required for Fotocasa (PerimeterX) and Idealista (DataDome).
  # Datacenter IPs are blocked by both portals; residential IPs bypass the check.
  #
  # Format:
  #   Single proxy : proxy: "http://user:pass@host:port"
  #   SOCKS5       : proxy: "socks5://user:pass@host:port"
  #   Pool (rotate): proxy_list:
  #                    - "http://user:pass@host1:port"
  #                    - "http://user:pass@host2:port"
  #
  # Recommended providers (pay-as-you-go, Spanish IPs available):
  #   • Bright Data (brightdata.com)  — best quality, ~$8.4/GB residential
  #   • Oxylabs (oxylabs.io)          — reliable, ~$8/GB, good ES coverage
  #   • Smartproxy (smartproxy.com)   — affordable, ~$7/GB starter plan
  #   • IPRoyal (iproyal.com)         — cheapest option, ~$3/GB
  #
  # Usage (pick one):
  #   Option A — env var (recommended): set SCRAPER_PROXY in .env  → no need to touch this file
  #   Option B — fill in below:         proxy: "http://user:pass@host:port"
  # Example: proxy: "http://brd-customer-XXXX-zone-residential-country-es:PASSWORD@brd.superproxy.io:22225"
  # ──────────────────────────────────────────────────────────────────────────
  proxy: ""
  proxy_list: []
  max_retries: 3
  selenium_fallback: false

portals:
  idealista:
    enabled: false  # needs residential proxy
    search_urls:
      - "https://www.idealista.com/venta-viviendas/madrid-madrid/"
      - "https://www.idealista.com/venta-viviendas/barcelona-barcelona/"
    max_pages: 3
  fotocasa:
    enabled: false  # needs residential proxy
    search_urls:
      - "https://www.fotocasa.es/es/comprar/viviendas/madrid-capital/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/todas-las-zonas/l"
    max_pages: 3
  pisos:
    enabled: true
    search_urls:
      - "https://www.pisos.com/venta/pisos-madrid/"
      - "https://www.pisos.com/venta/pisos-barcelona/"
      - "https://www.pisos.com/venta/pisos-valencia/"
      - "https://www.pisos.com/venta/pisos-sevilla/"
      - "https://www.pisos.com/venta/pisos-malaga/"
      - "https://www.pisos.com/venta/pisos-zaragoza/"
      - "https://www.pisos.com/venta/pisos-bilbao/"
      - "https://www.pisos.com/venta/pisos-alicante/"
    max_pages: 3
  habitaclia:
    enabled: false  # needs residential proxy
    search_urls:
      - "https://www.habitaclia.com/comprar-piso-en-madrid.htm"
      - "https://www.habitaclia.com/comprar-piso-en-barcelona.htm"
    max_pages: 3
  servihabitat:
    enabled: true
    search_urls:
      - "https://www.servihabitat.com/es/venta/vivienda/madrid"
      - "https://www.servihabitat.com/es/venta/vivienda/barcelona"
      - "https://www.servihabitat.com/es/venta/vivienda/valencia"
      - "https://www.servihabitat.com/es/venta/vivienda/sevilla"
    max_pages: 5
  solvia:
    enabled: true
    search_urls:
      - "https://www.solvia.es/es/comprar/viviendas/madrid"
      - "https://www.solvia.es/es/comprar/viviendas/barcelona"
      - "https://www.solvia.es/es/comprar/viviendas/valencia"
      - "https://www.solvia.es/es/comprar/viviendas/sevilla"
    max_pages: 5

rental_scraping:
  # Portals used to compute real market rent prices (updates DB every 7 days).
  # These reuse the same scraper logic — price field = monthly rent €.
  # Pisos.com works without proxy. Idealista/Fotocasa require SCRAPER_PROXY.
  portals:
    pisos:
      enabled: true
      max_pages: 5
      urls:
        - "https://www.pisos.com/alquiler/pisos-madrid/"
        - "https://www.pisos.com/alquiler/pisos-barcelona/"
        - "https://www.pisos.com/alquiler/pisos-valencia/"
        - "https://www.pisos.com/alquiler/pisos-sevilla/"
        - "https://www.pisos.com/alquiler/pisos-malaga/"
        - "https://www.pisos.com/alquiler/pisos-zaragoza/"
        - "https://www.pisos.com/alquiler/pisos-bilbao/"
        - "https://www.pisos.com/alquiler/pisos-alicante/"
    idealista:
      enabled: false  # requires SCRAPER_PROXY
      max_pages: 3
      urls:
        - "https://www.idealista.com/alquiler-viviendas/madrid-madrid/"
        - "https://www.idealista.com/alquiler-viviendas/barcelona-barcelona/"
        - "https://www.idealista.com/alquiler-viviendas/valencia-valencia/"
        - "https://www.idealista.com/alquiler-viviendas/sevilla-sevilla/"
        - "https://www.idealista.com/alquiler-viviendas/malaga-malaga/"
    fotocasa:
      enabled: false  # requires SCRAPER_PROXY
      max_pages: 3
      urls:
        - "https://www.fotocasa.es/es/alquiler/viviendas/madrid-capital/todas-las-zonas/l"
        - "https://www.fotocasa.es/es/alquiler/viviendas/barcelona-capital/todas-las-zonas/l"
        - "https://www.fotocasa.es/es/alquiler/viviendas/valencia-capital/todas-las-zonas/l"

analysis:
  assumed_expenses_pct: 0.25
  purchase_costs_pct:
    default: 0.10
    madrid: 0.07
    barcelona: 0.10
    andalucia: 0.09
    valencia: 0.10
  min_yield_alert_pct: 6.0
  capital_growth_annual_pct: 2.5
  scoring_weights:
    gross_yield: 0.35
    price_per_m2: 0.25
    location_score: 0.20
    condition_score: 0.10
    roi_net: 0.10

alerts:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    min_score_threshold: 65    # alert on score >= 65 (was 70 — too strict for bank properties)
    cooldown_hours: 24          # re-alert same property max once per day (was 168h=7 days)

scheduler:
  scrape_interval_hours: 12
  rental_scrape_interval_days: 7

