database:
  path: data/real_estate.db

# ═══════════════════════════════════════════════════════════════════════════
# ACQUISITION: portal alert emails (primary) — see docs/EMAIL_SETUP.md
#
# Scraping is dead for the portals that matter: Idealista and Fotocasa return
# 403 even from a residential IP, Habitaclia serves an anti-bot interstitial,
# and the bank portals are now SPAs with no server-rendered listings.
# Alert emails carry the same data, arrive pushed, and cannot be blocked.
# ═══════════════════════════════════════════════════════════════════════════
email_ingest:
  enabled: true
  backend: gmail_api          # gmail_api (OAuth, read-only) | imap (app password)
  token_path: data/gmail_token.json

  # Must include Spam: Gmail files portal alerts there routinely — every
  # Idealista alert was sitting in Spam while the inbox looked empty, which
  # reads exactly like "no new listings". Trash is excluded on purpose.
  query: "in:anywhere -in:trash"

# ── Reading the listing page ───────────────────────────────────────────────
# Alert emails omit the condition for most listings, and "para reformar" is
# worth tens of thousands in works the bank will not finance. For the few
# that match a profile, the page itself is read to recover it.
#
# Same treatment for every portal; it simply succeeds where the portal
# allows. Idealista and Fotocasa refuse datacenter IPs, so those keep their
# "condition unknown" flag rather than gaining a false one.
enrichment:
  enabled: true

scraping:
  enabled: false              # portals block us; kept for when that changes
  delay_min_seconds: 8
  delay_max_seconds: 15
  respect_robots: false
  proxy: ""                   # SCRAPER_PROXY env var overrides this
  proxy_list: []
  max_retries: 3
  selenium_fallback: false

# ═══════════════════════════════════════════════════════════════════════════
# SEARCH MODE: buy-to-let investment
# ═══════════════════════════════════════════════════════════════════════════
search_mode: investment

# ── Financing profile ──────────────────────────────────────────────────────
# Drives cuota, cashflow, cash-on-cash and DSCR. Adjust to whatever your
# bank actually offers you.
financing:
  ltv_pct: 90                 # banks are lending 90% again; 10% down payment
  annual_rate_pct: 3.0        # mortgage rate
  years: 30

  # What the buyer actually holds. The purchase demands 10% deposit plus
  # ~12% costs; anything above this is borrowed, and that loan has its own
  # monthly payment. Leaving it out makes every deal look affordable and
  # every cashflow look better than it is.
  # Two different numbers. available_cash is what the buyer can actually
  # deploy; comfortable_cash is what he would rather not exceed. Anything
  # between them is reserve — spendable, but worth being told about, since
  # "this one eats into your buffer" is a different decision from "this one
  # fits".
  available_cash: 40000
  comfortable_cash: 30000
  gap_loan_rate_pct: 5.5      # personal loan for anything above 40.000 €
  gap_loan_years: 8

  # Mortgage broker, paid only if one is needed. Usual shape in Spain is a
  # percentage with a floor.
  broker_fee_pct: 0.0
  broker_fee_min: 0

# ═══════════════════════════════════════════════════════════════════════════
# SEARCH PROFILES
#
# Three searches running at once over the same mailbox. They are separate
# because their criteria contradict each other: the home to live in is about
# a specific set of streets and needing no work, the investment is about a
# number and could be anywhere in Catalonia.
#
# A listing alerts if it matches ANY enabled profile, and the alert says
# which one. Place names are matched ignoring accents and apostrophes.
# ═══════════════════════════════════════════════════════════════════════════
search_profiles:

  # ── 1. Home to live in ──────────────────────────────────────────────────
  - name: vivienda
    label: "🏠 Para vivir"
    enabled: true
    # No financial bar at all. The buyer lives here, so there is no rent and
    # no cashflow to judge; paying more, and borrowing more, is an accepted
    # cost of getting the right flat. Zone, price, size and condition decide.
    purpose: home
    max_price: 330000
    min_rooms: 2
    max_rooms: 4
    min_area_m2: 65

    # No ground floors. Darker, noisier, easier to break into and harder to
    # resell — as decisive for a home as the price. Entresuelo and semisótano
    # count as the same thing, and are caught from the description when the
    # structured field is empty.
    min_floor: 1

    # Districts are scoped to their town on purpose: "Passeig Maragall" is a
    # street in Gavà as well as a neighbourhood in Barcelona, and an unscoped
    # list files the Gavà flat under a Barcelona search.
    # An entry with no districts accepts the whole town.
    areas:
      - city: barcelona
        districts:
          - camp de l arpa      # accents and apostrophes are ignored
          - el clot
          - maragall
          - sagrada familia
          - navas
          - la sagrera
          - sant andreu
          - el guinardo
      # Llobregat side, accepted in full
      - city: sant feliu de llobregat
      - city: sant just desvern
      - city: esplugues

    # Move-in ready. Below the price named here a refurbishment stops being a
    # drawback and becomes part of the deal, so the requirement lifts.
    condition_in: [nuevo, buen_estado]
    needs_work_below_price: 240000

  # ── 2. Investment ───────────────────────────────────────────────────────
  - name: inversion
    label: "💰 Inversión"
    enabled: true
    purpose: investment

    # No zone restriction: anywhere in Catalonia within driving distance.
    # Distance is not enforced — the portal alerts already bound the area, and
    # nothing in the listing data gives a reliable travel time.

    # An investment has to stand on its own: reachable with the cash in hand,
    # and paying its own way from month one. Both bars must clear.
    min_net_yield_pct: 6.0
    min_monthly_cashflow: 0

    # Entry must fit the 40.000 € the buyer can reach, without borrowing:
    # a flat that needs a loan just to be entered is not funding itself.
    # At ~22% of price in deposit and costs that is a ~180.000 € ceiling.
    # Between 30.000 € and 40.000 € the alert says it is using the reserve.
    max_cash_needed: 40000
    max_cash_gap: 0

    # Town size, as a proxy for everyday services: supermarket, health
    # centre, school, train. Mercadona opens above roughly this size. A
    # village of 2.000 may be cheap, but the exit is the problem — a flat
    # there takes far longer to let and to sell again.
    min_population: 20000
    reject_unknown_population: true

    # Do not send what could not be checked. The cheapest flats are cheap
    # because they are occupied or unmortgageable, and the alert email never
    # says so — the page does. If the page could not be read, the listing
    # stays unsent rather than arriving with an unverifiable 9% yield.
    require_verified_condition: true

    # Zones ruled out by hand. There is no free, structured dataset for
    # "how conflictive is this neighbourhood", so this list stands in for
    # one, using the criterion there IS published data for: the lowest
    # household-income neighbourhoods of their metropolitan area (INE Atlas
    # de distribución de renta). That is the same signal that drives the
    # risk an investor actually carries here — longer voids, harder resale,
    # tenants who cannot absorb a rent rise.
    #
    # These are a starting point, not a verdict. Edit freely: anything named
    # here is dropped before the yield is even computed.
    excluded_zones:
      - sant roc            # Badalona
      - la salut            # Badalona
      - can puiggener       # Sabadell
      - la mina             # Sant Adrià de Besòs
      - ciutat meridiana    # Barcelona
      - torre baro          # Barcelona
      - vallbona            # Barcelona
      - sant cosme          # El Prat de Llobregat

  # ── 3. Home, further out and bigger ─────────────────────────────────────
  # The trade the buyer is willing to make: leave the city, gain square
  # metres. Same purpose as the Barcelona search — no rental maths — but
  # stricter on what the flat has to be, since distance has to buy something.
  - name: vivienda_fuera
    label: "🏠 Para vivir (fuera)"
    enabled: true
    purpose: home
    max_price: 330000
    min_rooms: 3
    min_area_m2: 80

    # High floor, and light. Moving out of Barcelona for a dark second floor
    # would be paying the commute for nothing.
    min_floor: 2
    require_any_of: [balcon, balcón, terraza, terrat, patio]
    prefer_bright: true

    areas:
      - city: premia de mar
      - city: castelldefels
      - city: gava
      - city: mataro

    condition_in: [nuevo, buen_estado]
    needs_work_below_price: 240000

  # ── 4. New build ────────────────────────────────────────────────────────
  # Disabled: no portal alert feeds it yet, so it would never fire. Enable it
  # once an "obra nueva" alert exists, within 40 min of Barcelona.
  - name: obra_nueva
    label: "🏗 Obra nueva"
    enabled: false
    max_price: 400000
    min_rooms: 2
    condition_in: [nuevo]

# ── Target locations ──────────────────────────────────────────────────────
# TEST MODE: solo Barcelona, barrios específicos alrededor de Maragall/Clot
target_locations:
  - city: barcelona
    preferred_districts:
      - "maragall"
      - "el guinardó"
      - "guinardó"
      - "el camp de l'arpa del clot"
      - "camp de l'arpa"
      - "camp de l arpa"
      - "el clot"
      - "clot"
      - "la sagrada família"
      - "la sagrada familia"
      - "sagrada família"
      - "sagrada familia"
      - "navas"
      - "la sagrera"

# ── Residence criteria: single profile ─────────────────────────────────────
residence_criteria:
  profile_general:
    label: "General"
    max_price: 335000                  # tope hasta 335k
    min_rooms: 3                        # más de 2 hab
    require_condition: null             # any condition allowed
    forbid_condition: ["reformar"]      # no reformar (casi para entrar a vivir)
    max_years_old: null                 # no restringido

# ── Common requirements ────────────────────────────────────────────────────
common_requirements:
  min_area_m2: 60                       # tamaño razonable
  require_elevator: true                # ascensor obligatorio
  require_balcony: false                # no obligatorio
  min_floor: 3                          # planta ≥ 3 (después de la 2ª)
  max_published_ago_hours: 48           # solo anuncios publicados en las últimas 48h

# ═══════════════════════════════════════════════════════════════════════════
# Portals - URLs per target location
# ═══════════════════════════════════════════════════════════════════════════
portals:
  # ── Runs on residential IP (Mac) → all 4 portals available ─────────────
  pisos:
    enabled: true
    search_urls:
      - "https://www.pisos.com/venta/pisos-barcelona-el_guinardo/"
      - "https://www.pisos.com/venta/pisos-barcelona-la_sagrada_familia/"
      - "https://www.pisos.com/venta/pisos-barcelona-el_clot/"
      - "https://www.pisos.com/venta/pisos-barcelona-navas/"
    max_pages: 5

  habitaclia:
    enabled: true
    search_urls:
      - "https://www.habitaclia.com/viviendas-el_camp_del_arpa_del_clot-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-el_clot-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-la_sagrada_familia-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-navas-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-el_guinardo-barcelona.htm"
      - "https://www.habitaclia.com/viviendas-la_sagrera-barcelona.htm"
    max_pages: 5

  idealista:
    enabled: true
    search_urls:
      - "https://www.idealista.com/venta-viviendas/barcelona/eixample/la-sagrada-familia/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-marti/el-camp-de-larpa-del-clot/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-marti/el-clot/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-andreu/navas/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/horta-guinardo/el-guinardo/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-andreu/la-sagrera/con-precio-hasta_335000,de-tres-dormitorios,de-cuatro-cinco-habitaciones,ascensor/"
    max_pages: 5
  fotocasa:
    enabled: true
    search_urls:
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/la-sagrada-familia/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-clot/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-camp-de-l-arpa-del-clot/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/navas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/el-guinardo/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/la-sagrera/l"
    max_pages: 5

  # ── Bank-owned portals: not relevant for Barcelona metro residence search ──
  servihabitat:
    enabled: false
    search_urls: []
    max_pages: 3
  solvia:
    enabled: false
    search_urls: []
    max_pages: 3

# ═══════════════════════════════════════════════════════════════════════════
# Alerts
# ═══════════════════════════════════════════════════════════════════════════
alerts:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    # Only used by the legacy scraping path and the daily digest ranking.
    # Alerts from the email pipeline are gated by search_profiles, not by
    # this score: rental return is meaningless for a home to live in.
    min_score_threshold: 60
    cooldown_hours: 24

scheduler:
  scrape_interval_hours: 12
  rental_scrape_interval_days: 30    # rental data less important for residence search

# ═══════════════════════════════════════════════════════════════════════════
# Legacy investment analysis (kept but not used when search_mode=residence)
# ═══════════════════════════════════════════════════════════════════════════
analysis:
  # Guards against listings whose m² is the plot rather than the built area
  # (masías, casas con terreno). Rent is estimated per m², so those produce a
  # fake rent and a fake yield that would rank first.
  sanity:
    min_price_per_m2: 800
    max_price_per_m2: 15000

  # Full refurbishment in the Barcelona area, per m² of built area. A rough
  # figure — kitchen, bathroom, floors, wiring — but far closer than zero,
  # which is what a listing marked "para reformar" was being costed at.
  # Only applied when the advert says the flat needs work.
  reform_cost_per_m2: 500

  assumed_expenses_pct: 0.25
  purchase_costs_pct:
    default: 0.12
    madrid: 0.07
    barcelona: 0.12       # ITP 10% + notaría, registro y gestoría
    andalucia: 0.09
    valencia: 0.10
  min_yield_alert_pct: 6.0
  capital_growth_annual_pct: 2.5
  scoring_weights:
    gross_yield: 0.35
    price_per_m2: 0.25
    location_score: 0.20
    condition_score: 0.10
    roi_net: 0.10

rental_scraping:
  portals:
    pisos:
      enabled: false
      max_pages: 3
      urls: []
    idealista:
      enabled: false
      max_pages: 3
      urls: []
    fotocasa:
      enabled: false
      max_pages: 3
      urls: []

# ═══════════════════════════════════════════════════════════════════════════
# Fallback rent per m² (used only if search_mode=investment)
