database:
  path: data/real_estate.db

scraping:
  delay_min_seconds: 3
  delay_max_seconds: 8
  respect_robots: true
  #
  # ── Residential Proxy ──────────────────────────────────────────────────────
  # REQUIRED for Idealista, Fotocasa, and Habitaclia (the main portals for
  # Barcelona metro area). Without proxy these portals return 403.
  #
  # Set SCRAPER_PROXY in .env  →  http://user:pass@host:port
  # ──────────────────────────────────────────────────────────────────────────
  proxy: ""
  proxy_list: []
  max_retries: 3
  selenium_fallback: false

# ═══════════════════════════════════════════════════════════════════════════
# SEARCH MODE: primary residence (not investment)
# ═══════════════════════════════════════════════════════════════════════════
search_mode: residence

# ── Target locations ──────────────────────────────────────────────────────
# Add/remove locations here. Each entry defines a city (canonical name)
# and optionally allowed_districts (whitelist) or excluded_districts (blacklist).
target_locations:
  - city: sant just desvern
  - city: molins de rei
  - city: sant feliu de llobregat
  - city: sant cugat del vallès
  - city: castelldefels
    # Solo zonas concretas, principalmente Montemar
    preferred_districts: ["montemar", "el poal", "els canyars", "vista alegre", "playa"]
    excluded_districts: ["muntanya circular", "bellamar-poal", "zona industrial"]
  - city: premià de dalt
  - city: premià de mar
    # Solo debajo de Gran Via (zona costa/centro)
    preferred_districts: ["centre", "eixample", "sant cristòfol", "santa anna", "costa", "platja", "playa"]
    excluded_districts: ["muntanya", "abril"]
  - city: vilassar de mar
  - city: vilassar de dalt
  - city: esplugues de llobregat
    preferred_districts: ["centre", "pueblo", "poble", "casc antic"]
  - city: barcelona
    preferred_districts: ["camp de l'arpa del clot", "camp de l'arpa", "el clot", "el guinardó", "guinardó"]

# ── Residence criteria: two profiles ──────────────────────────────────────
residence_criteria:
  # Perfil A: obra nueva, ≤ 360k, ≥ 2 hab
  profile_new:
    label: "Obra nueva"
    max_price: 360000
    min_rooms: 2
    require_condition: ["nuevo"]      # only new-build
    max_years_old: null

  # Perfil B: hasta 20 años, ≥ 3 hab, ≤ 285k (negociable hasta 315k)
  profile_recent:
    label: "Reciente (≤20 años)"
    max_price: 285000
    max_price_soft: 315000            # slightly above → soft-match (negotiable)
    min_rooms: 3
    max_years_old: 20
    require_condition: null           # any condition allowed

# ── Common requirements (both profiles) ───────────────────────────────────
common_requirements:
  min_area_m2: 60                     # minimum apartment size
  require_elevator: true              # ascensor
  require_balcony: true               # balcón, terraza o patio
  prefer_views: true                  # "vistas amplias" — used as bonus, not hard filter

# ═══════════════════════════════════════════════════════════════════════════
# Portals - URLs per target location
# ═══════════════════════════════════════════════════════════════════════════
portals:
  idealista:
    enabled: true                     # NEEDS PROXY
    search_urls:
      - "https://www.idealista.com/venta-viviendas/sant-just-desvern/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/molins-de-rei/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/sant-feliu-de-llobregat/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/sant-cugat-del-valles/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/castelldefels/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/premia-de-dalt/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/premia-de-mar/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/vilassar-de-mar/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/vilassar-de-dalt/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/esplugues-de-llobregat/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/barcelona/sant-marti/el-camp-de-larpa-del-clot/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
      - "https://www.idealista.com/venta-viviendas/barcelona/horta-guinardo/el-guinardo/con-precio-hasta_360000,de-dos-dormitorios,de-tres-dormitorios,ascensor,balcon-terraza-o-patio/"
    max_pages: 5

  fotocasa:
    enabled: true                     # NEEDS PROXY
    search_urls:
      - "https://www.fotocasa.es/es/comprar/viviendas/sant-just-desvern/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/molins-de-rei/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/sant-feliu-de-llobregat/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/sant-cugat-del-valles/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/castelldefels/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/premia-de-dalt/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/premia-de-mar/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/vilassar-de-mar/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/vilassar-de-dalt/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/esplugues-de-llobregat/todas-las-zonas/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/sant-marti/l"
      - "https://www.fotocasa.es/es/comprar/viviendas/barcelona-capital/horta-guinardo/l"
    max_pages: 5

  habitaclia:
    enabled: true                     # NEEDS PROXY (works well in Cataluña)
    search_urls:
      - "https://www.habitaclia.com/comprar-en-sant_just_desvern.htm"
      - "https://www.habitaclia.com/comprar-en-molins_de_rei.htm"
      - "https://www.habitaclia.com/comprar-en-sant_feliu_de_llobregat.htm"
      - "https://www.habitaclia.com/comprar-en-sant_cugat_del_valles.htm"
      - "https://www.habitaclia.com/comprar-en-castelldefels.htm"
      - "https://www.habitaclia.com/comprar-en-premia_de_dalt.htm"
      - "https://www.habitaclia.com/comprar-en-premia_de_mar.htm"
      - "https://www.habitaclia.com/comprar-en-vilassar_de_mar.htm"
      - "https://www.habitaclia.com/comprar-en-vilassar_de_dalt.htm"
      - "https://www.habitaclia.com/comprar-en-esplugues_de_llobregat.htm"
      - "https://www.habitaclia.com/comprar-en-barcelona-camp_de_larpa.htm"
      - "https://www.habitaclia.com/comprar-en-barcelona-el_guinardo.htm"
    max_pages: 5

  # Disabled: bank-owned portals rarely have listings in these locations
  pisos:
    enabled: false
    search_urls: []
    max_pages: 3
  servihabitat:
    enabled: false
    search_urls: []
    max_pages: 3
  solvia:
    enabled: false
    search_urls: []
    max_pages: 3

# ═══════════════════════════════════════════════════════════════════════════
# Alerts
# ═══════════════════════════════════════════════════════════════════════════
alerts:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    min_score_threshold: 60           # residence match score threshold
    cooldown_hours: 24

scheduler:
  scrape_interval_hours: 12
  rental_scrape_interval_days: 30    # rental data less important for residence search

# ═══════════════════════════════════════════════════════════════════════════
# Legacy investment analysis (kept but not used when search_mode=residence)
# ═══════════════════════════════════════════════════════════════════════════
analysis:
  assumed_expenses_pct: 0.25
  purchase_costs_pct:
    default: 0.10
    madrid: 0.07
    barcelona: 0.10
    andalucia: 0.09
    valencia: 0.10
  min_yield_alert_pct: 6.0
  capital_growth_annual_pct: 2.5
  scoring_weights:
    gross_yield: 0.35
    price_per_m2: 0.25
    location_score: 0.20
    condition_score: 0.10
    roi_net: 0.10

rental_scraping:
  portals:
    pisos:
      enabled: false
      max_pages: 3
      urls: []
    idealista:
      enabled: false
      max_pages: 3
      urls: []
    fotocasa:
      enabled: false
      max_pages: 3
      urls: []

# ═══════════════════════════════════════════════════════════════════════════
