name: Pisos bot

# Runs the bot without a server, and without paying for one.
#
# Earlier this workflow was a cron that did one cycle and exited. That never
# worked: GitHub treats schedules as best-effort and delays them heavily, so
# even at "*/10" the real gap between runs was 17-104 minutes (median 40).
# Asking for more frequent crons does not make any single one punctual.
#
# So the job no longer exits after one cycle. It stays alive for hours and
# ticks every few minutes from inside, which GitHub cannot delay. A job may
# run for at most 6 hours, so the schedule below exists only to keep a
# successor queued: the concurrency group holds it until the running loop
# finishes, and it starts within seconds of that. Actions minutes are
# unmetered on public repositories, so a permanently-running job is free.
#
# State (which emails were processed, which listings are known, what was
# already alerted) lives in state/db.sql — a text dump of the SQLite
# database, restored when the loop starts and committed by scripts/save-state.sh
# after every cycle that changed something.
#
# The loop runs one command and only one. It used to also run the daily
# digest, guarded by a date written to the database — and on the runner, for
# reasons that never reproduced locally, that date did not stick, so the
# digest went out every three minutes saying "3 match, I already sent them
# all". The tick sends each new match on its own as it appears, so the daily
# summary was adding a ritual nobody asked for on top of a guard that did
# not hold. It is still available by hand for anyone who wants it.

on:
  schedule:
    # Not "run now" — "be next in line". One of these lands within minutes of
    # the running loop finishing, so the chain does not break.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "loop = arrancar el bucle ya; el resto = un ciclo suelto"
        required: false
        default: loop
        type: choice
        options: [loop, tick, digest, mail-check]

# Never let two runs touch state/db.sql at once — the loser would push a dump
# built from a stale database and silently undo the other's progress.
# A manual dispatch is a deliberate "do it now", so it takes the slot from the
# loop; the next scheduled run — or a dispatch with command=loop — restarts it.
concurrency:
  group: pisos-bot-state
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

env:
  # Just under the 6-hour ceiling GitHub imposes on a single job.
  LOOP_MINUTES: 340
  # How often the bot checks the mailbox and answers Telegram.
  CYCLE_SECONDS: 180

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore database from state dump
        run: python main.py db-restore

      - name: Run one command now
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command != 'loop'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py "${{ github.event.inputs.command || 'tick' }}"

      # Also reachable by hand: the chain has to be startable without waiting
      # for a schedule that GitHub may sit on for the best part of an hour.
      - name: Watch the mailbox continuously
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.command == 'loop'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          cycle=0

          while :; do
            cycle=$((cycle + 1))
            echo "::group::Ciclo $cycle — $(date -u +%H:%M:%SZ)"

            # A failed cycle must not end the loop: a Gmail hiccup or a
            # Telegram timeout should cost three minutes, not six hours.
            # The chat is answered before the mailbox is read, so a broken
            # mailbox never costs a reply.
            BOT_CYCLE=$cycle python main.py tick \
              || echo "tick falló, se reintenta en el siguiente ciclo"

            bash scripts/save-state.sh || true
            echo "::endgroup::"

            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep "$CYCLE_SECONDS"
          done

          echo "Turno completado tras $cycle ciclos; el siguiente run toma el relevo."

      # Runs even if the loop crashed or was cancelled: alerts already sent
      # must not be forgotten, or the next run repeats them.
      - name: Save state
        if: always()
        run: bash scripts/save-state.sh || true
